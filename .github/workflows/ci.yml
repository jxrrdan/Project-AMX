name: CI

# Runs on every pull request and push to main: lint, test, build, dependency audit, infrastructure
# synth and a container build. Nothing here needs cloud credentials.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx nx run-many -t lint test build -p shared api web

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the build on high/critical advisories in runtime dependencies. Known, reviewed
      # exceptions are listed in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=critical

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: >
          npx cdk synth --quiet
          -c domainName=ams.example.co.uk -c emailFrom=no-reply@example.co.uk
          -c bedrockReasoningModel=example-reasoning -c bedrockLightweightModel=example-lightweight

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
